<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#063A9B" />
  <!-- Helmet / Motorcycle motif -->
  <circle cx="256" cy="256" r="180" fill="#0B57D0" />
  <!-- Motorcycle silhouette / badge -->
  <g fill="none" stroke="#FFC107" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Wheel -->
    <circle cx="160" cy="320" r="48" fill="#101B3D" stroke="#FFC107" stroke-width="20" />
    <!-- Front Wheel -->
    <circle cx="352" cy="320" r="48" fill="#101B3D" stroke="#FFC107" stroke-width="20" />
    <!-- Frame -->
    <path d="M160 320 L230 320 L280 240 L352 320" />
    <path d="M230 320 L210 230 L280 230" />
    <!-- Handlebars and fork -->
    <path d="M352 320 L310 190 L270 190" />
    <!-- Seat -->
    <path d="M190 230 L250 230" stroke="#FFFFFF" stroke-width="18" />
  </g>
  <!-- Accent Rider Helmet -->
  <circle cx="260" cy="150" r="32" fill="#FFC107" />
  <path d="M245 155 Q275 155 285 160" stroke="#101B3D" stroke-width="8" stroke-linecap="round" />
</svg>
